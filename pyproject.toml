[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "floodcut"
version = "0.1.0"
description = "Educational fixed-k QAOA prototype for selecting synthetic flood-diversion breach sites (Qiskit Fall Fest 2026)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["qiskit>=2.0,<3", "numpy", "scipy", "matplotlib"]

[project.optional-dependencies]
app = ["streamlit"]
report = ["python-docx"]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
